name: Build Atmos iPhone App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Compile iPhone application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project WeatherGlass.xcodeproj -scheme WeatherGlass -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -n 60
      - name: Package unsigned IPA for Sideloadly
        shell: bash
        run: |
          set -euo pipefail
          APP=DerivedData/Build/Products/Release-iphoneos/WeatherGlass.app
          test -f "$APP/WeatherGlass"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          test "$BUNDLE" = "io.github.kh1zsn0w.atmosweather"
          mkdir -p Package/Payload
          cp -R "$APP" Package/Payload/
          cd Package
          zip -q -r ../Atmos-Weather-v1.0-unsigned.ipa Payload
          cd ..
          unzip -t Atmos-Weather-v1.0-unsigned.ipa | tail -n 2
          ls -lh Atmos-Weather-v1.0-unsigned.ipa
      - name: Upload IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Atmos-iPhone-v1.0
          path: |
            Atmos-Weather-v1.0-unsigned.ipa
            build.log
          if-no-files-found: warn
          retention-days: 7
