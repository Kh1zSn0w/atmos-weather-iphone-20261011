name: WeatherGlass
options:
  bundleIdPrefix: io.github.kh1zsn0w
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  WeatherGlass:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WeatherGlass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kh1zsn0w.atmosweather
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Atmos
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Use your location to show nearby weather."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
